spring:
  application:
    name: awn-api
  datasource:
    url: ${AWN_DB_URL:jdbc:postgresql://localhost:5432/awn}
    username: ${AWN_DB_USER:awn}
    password: ${AWN_DB_PASSWORD:awn}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${AWN_REDIS_HOST:localhost}
      port: ${AWN_REDIS_PORT:6379}

server:
  port: 8080

logging:
  pattern:
    # 日志级别后携带 traceId，一次请求所有日志行可关联（%X{traceId:-} 空值不输出内容）
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true

awn:
  worker:
    # API 进程不执行后台任务
    enabled: false
  admin:
    # 运营接口令牌（生产环境必须通过环境变量覆盖）
    token: ${AWN_ADMIN_TOKEN:awn-admin-dev-token}
  ratelimit:
    # 管理面限流存储：memory（默认，进程内）| redis（生产多实例共享额度）
    store: ${AWN_RATELIMIT_STORE:memory}
    # 管理面限流：每资源组每窗口请求数
    admin-limit: 100
    admin-window: 60s
