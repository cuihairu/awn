spring:
  application:
    name: awn-api
  datasource:
    url: ${AWN_DB_URL:jdbc:postgresql://localhost:5432/awn}
    username: ${AWN_DB_USER:awn}
    password: ${AWN_DB_PASSWORD:awn}
    hikari:
      maximum-pool-size: 20
  intel-datasource:
    # 情报独立数据源（Hikari 平铺属性）：默认回退主源同值；
    # 部署收紧（S4）后指向受限账号 awn_intel
    jdbc-url: ${AWN_INTEL_DB_URL:${spring.datasource.url}}
    username: ${AWN_INTEL_DB_USER:${spring.datasource.username}}
    password: ${AWN_INTEL_DB_PASSWORD:${spring.datasource.password}}
    maximum-pool-size: 6
    minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移独立连接：默认与主源相同；运行账号切到 awn_trading 后（S4），
    # V8–V10 的 intelligence 建表仍需高权限账号执行
    url: ${AWN_MIGRATE_DB_URL:${spring.datasource.url}}
    user: ${AWN_MIGRATE_DB_USER:${spring.datasource.username}}
    password: ${AWN_MIGRATE_DB_PASSWORD:${spring.datasource.password}}
    # V29 的 awn_trading 密码占位符在 FlywayPlaceholderConfig 注入
    #（Spring 绑定 Map 值不解析 ${}，不能写在 YAML 里）
  data:
    redis:
      host: ${AWN_REDIS_HOST:localhost}
      port: ${AWN_REDIS_PORT:6379}

server:
  port: 8080

logging:
  pattern:
    # 日志级别后携带 traceId，一次请求所有日志行可关联（%X{traceId:-} 空值不输出内容）
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true

awn:
  worker:
    # API 进程不执行后台任务
    enabled: false
  admin:
    # 运营接口令牌（生产环境必须通过环境变量覆盖）
    token: ${AWN_ADMIN_TOKEN:awn-admin-dev-token}
  api:
    # 本地开发默认值；prod profile 强制通过环境变量提供独立密钥。
    token-secret: ${AWN_API_TOKEN_SECRET:awn-local-development-token-secret-change-before-production}
  ratelimit:
    # 管理面限流存储：memory（默认，进程内）| redis（生产多实例共享额度）
    store: ${AWN_RATELIMIT_STORE:memory}
    # 管理面限流：每资源组每窗口请求数
    admin-limit: 100
    admin-window: 60s
