<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 144" role="img" aria-label="AWN wordmark">
  <!-- 方向一：字标。A/W/N 手绘几何字形，W 底部顶点延伸出麦芒尖刺（深金 #A16207），A/N 主体金 #D59819。
       深浅背景通用（仅用品牌金系，不用墨色）。源文件与说明见 design-system/logo-candidates/ -->
