packages:
  - docs
  - apps/web
  - apps/admin
  - apps/miniprogram
  - packages/*

overrides:
  html-minifier: ^5.4.0
  glob: ^14.0.6
  serialize-javascript: ^7.1.4
  minimatch: '>=11.0.1'
  postcss: ^8.5.29
  swiper: ~12.2.0
  lodash-es: ^4.18.1
  katex: ^0.18.2
  decode-uri-component: ^0.5.1
  adm-zip: ^0.6.0
  download-git-repo: file:scripts/shims/download-git-repo
  latest-version: file:scripts/shims/latest-version
  esbuild: 0.28.2
  uuid: 11.1.1
  webpack-dev-middleware: 7.4.6
  # 310：vitepress 1.6.4 声明依赖 vite ^5.4.14（普通依赖而非 peer，无硬约束）；5.4.21 为
  # 5.x 末版且被 8 个 advisory 覆盖（patched ≥6.4.2）。实测 vitepress 1.6.4 在 vite 6.4.6 下
  # docs build 通过（87.69s），故用 `parent>child` 选择器把 vite 仅限到 vitepress 链
  # （admin 直依赖 ^7.1.0 仍解析 7.3.7，不受影响）。
  'vitepress>vite': 6.4.6
  # 322：wds 4.15.2 被 6 个 moderate advisory 覆盖（patched ≥5.2.6）。Taro webpack5-runner 的
  # getDevServerOptions 硬编码 `https:false`，wds 5.2.6+ 移除该键（additionalProperties:false）
  # 且仅在构造 dev server 时 validate —— 但构造只发生在 dev/watch 分支（index.h5.js:109-124）；
  # 生产 build 走 !isWatch 分支（:73）从不构造 dev server，weapp mini runner 根本不 import wds。
  # 且 H5/weapp dev 已因 webpack-virtual-modules 0.6.2（另一上游死结）整体不可跑，无可用路径回归。
  # 故升到 5.2.7（最新 patched 5.x）可清 6 findings 且不破生产构建/测试；dev 维持既断。
  webpack-dev-server: 5.2.7

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true

# pnpm 12 默认拒绝发布后 24h 内的版本（供应链护栏）。本仓的依赖审计恰恰是
# 「漏洞补丁发布后立刻锁版本」（如 html-minifier 5.4.0 发布次日即被 override），
# 24h 门槛与本工作流冲突，故显式关闭；锁文件本身经 CI --frozen-lockfile 校验。
minimumReleaseAge: 0
