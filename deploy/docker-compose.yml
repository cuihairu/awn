# AWN 单机部署编排（docker compose）
#
# 拓扑：caddy(80/443) → web(3000) / admin(5174) / awn-api(8080)
#       postgresql(5432) + redis(6379) + rustfs(9000 S3 / 9001 控制台)
#
# 说明：
# - PostgreSQL 是库存唯一权威；所有容器通过同一内网网络访问。
# - 情报库使用独立 schema 与角色（awn_intel），见 docs/architecture/intelligence-isolation.md。
# - 首次部署前复制 .env.example 为 .env 并填写密钥；.env 不入库。

name: awn

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
      - awn-api

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      AWN_API_BASE: http://awn-api:8080
    depends_on:
      - awn-api

  admin:
    build:
      context: ..
      dockerfile: deploy/docker/admin.Dockerfile
    restart: unless-stopped
    depends_on:
      - awn-api

  awn-api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
      args:
        # 出口网络受限时在 .env 里设 CENTRAL_MIRROR=https://maven.aliyun.com/repository/central
        CENTRAL_MIRROR: ${CENTRAL_MIRROR:-https://repo.maven.apache.org/maven2}
    restart: unless-stopped
    environment:
      AWN_DB_URL: jdbc:postgresql://postgresql:5432/awn
      # 运行账号=受限交易角色（仅交易表组读写、无 CREATE、情报零权限，见 V12）
      AWN_DB_USER: awn_trading
      AWN_DB_PASSWORD: ${AWN_TRADING_DB_PASSWORD:?set AWN_TRADING_DB_PASSWORD in .env}
      # V29 迁移占位符：与运行账号同值，启动时把 awn_trading 密码对齐到部署配置
      AWN_TRADING_DB_PASSWORD: ${AWN_TRADING_DB_PASSWORD:?set AWN_TRADING_DB_PASSWORD in .env}
      # 情报独立数据源：受限情报角色 awn_intel（intelligence schema 读写、交易零权限）
      AWN_INTEL_DB_USER: awn_intel
      AWN_INTEL_DB_PASSWORD: ${AWN_INTEL_DB_PASSWORD:?set AWN_INTEL_DB_PASSWORD in .env}
      # Flyway 迁移连接：需建表权限（V8–V10 建 intelligence schema 表、V12/V29 管角色），走引导账号
      AWN_MIGRATE_DB_USER: awn_app
      AWN_MIGRATE_DB_PASSWORD: ${AWN_DB_PASSWORD:?set AWN_DB_PASSWORD in .env}
      AWN_ADMIN_TOKEN: ${AWN_ADMIN_TOKEN:?set AWN_ADMIN_TOKEN in .env}
      AWN_API_TOKEN_SECRET: ${AWN_API_TOKEN_SECRET:?set AWN_API_TOKEN_SECRET in .env}
      AWN_REDIS_HOST: redis
      # 管理面限流存储：compose 栈内已有 redis，默认启用多实例共享额度
      AWN_RATELIMIT_STORE: ${AWN_RATELIMIT_STORE:-redis}
      SPRING_PROFILES_ACTIVE: prod
    # 仅本机回环暴露，供一键冒烟（生产流量走 caddy，不依赖此端口；18080 避开宿主机常用 8080）
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  awn-worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
      args:
        CENTRAL_MIRROR: ${CENTRAL_MIRROR:-https://repo.maven.apache.org/maven2}
    restart: unless-stopped
    environment:
      AWN_DB_URL: jdbc:postgresql://postgresql:5432/awn
      # 运行账号=受限交易角色；worker 生产关闭 Flyway，无需迁移连接
      AWN_DB_USER: awn_trading
      AWN_DB_PASSWORD: ${AWN_TRADING_DB_PASSWORD:?set AWN_TRADING_DB_PASSWORD in .env}
      AWN_INTEL_DB_USER: awn_intel
      AWN_INTEL_DB_PASSWORD: ${AWN_INTEL_DB_PASSWORD:?set AWN_INTEL_DB_PASSWORD in .env}
      AWN_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      awn-api:
        condition: service_healthy

  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: awn
      POSTGRES_USER: awn_app
      POSTGRES_PASSWORD: ${AWN_DB_PASSWORD:?set in .env}
      # init-intel.sh 从这里读情报角色密码（initdb 只在空卷首启执行）
      AWN_INTEL_DB_PASSWORD: ${AWN_INTEL_DB_PASSWORD:?set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 情报独立 schema + 最小权限角色（首启时由 wrapper 以 psql 变量注入密码执行；
      # SQL 挂到 /opt/awn-init 是为了不被 entrypoint 当作 .sql 自动执行——
      # 其密码是 psql 变量，没有 -v 传参会报错）
      - ./config/postgres/init-intel.sql:/opt/awn-init/init-intel.sql:ro
      - ./config/postgres/init-intel.sh:/docker-entrypoint-initdb.d/10-init-intel.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awn_app -d awn"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # RustFS：S3 兼容对象存储（Rust 实现的 MinIO 替代）
  # 镜像内以非 root 用户 rustfs(10001) 运行；9000=S3 API，9001=Web 控制台（仅内网）
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-awn_storage}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set in .env}
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs

volumes:
  pg_data:
  redis_data:
  rustfs_data:
  rustfs_logs:
  caddy_data:
  caddy_config:
