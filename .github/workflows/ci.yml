name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 测试含 Testcontainers（PostgreSQL 16），ubuntu-latest 自带 Docker
      # 覆盖：上下文装配、Flyway 迁移、Spring Modulith 边界校验
      - name: Build and test
        run: mvn -B -ntp verify -pl apps/awn-api,apps/awn-worker -am

  frontend:
    name: frontend (docs + web + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @awn/docs build
      - run: pnpm --filter @awn/web build
      - run: pnpm --filter @awn/admin build

      # TODO(Phase 02): 小程序 build:weapp 入门禁——需先处理 pnpm 10 拦截的
      # 依赖构建脚本（@tarojs/cli、@swc/core、esbuild），CI 内 pnpm approve-builds --global

  client:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: apps/client

      - run: flutter analyze
        working-directory: apps/client
