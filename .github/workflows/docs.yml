name: docs

on:
  push:
    branches: [main]
    # 文档站部署的正向触发：站点内容与构建输入。
    # 旧 paths-ignore 把 docs/** 排除了——文档站部署 workflow 忽略文档自身
    # 变更，docs-only 推送从不重部署（实测 root 404 拖三周才闭合的根因）。
    # pnpm-lock.yaml / package.json / pnpm-workspace.yaml 影响安装产物，
    # 同样必须触发（安全相关的锁文件更新不得绕过文档站门禁）。
    paths:
      - "docs/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0 --config.dangerouslyAllowAllBuilds=true

      - name: Build
        run: pnpm -C docs build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
