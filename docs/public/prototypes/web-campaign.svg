<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0A09"/>
      <stop offset="0.6" stop-color="#1C1917"/>
      <stop offset="1" stop-color="#292524"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#D59819" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#A16207" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A16207" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow2" cx="0.15" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#D59819" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D59819" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coverA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C2D12"/><stop offset="1" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="coverB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/><stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="coverC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134E4A"/><stop offset="1" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="goldBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9B83F"/><stop offset="1" stop-color="#C8891A"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1C1917" flood-opacity="0.08"/>
    </filter>
    <filter id="floatShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ===== 页面背景 ===== -->
  <rect width="1440" height="1000" fill="#FAFAF9"/>

  <!-- ===== 顶部导航 ===== -->
  <rect width="1440" height="64" fill="#FFFFFF"/>
  <rect y="63" width="1440" height="1" fill="#E7E5E4"/>
  <!-- Logo -->
  <g transform="translate(48,14)">
    <rect x="0" y="6" width="30" height="22" rx="5" fill="none" stroke="#D59819" stroke-width="2.4"/>
    <circle cx="5.5" cy="17" r="2.2" fill="#FAFAF9" stroke="#D59819" stroke-width="2"/>
    <circle cx="24.5" cy="17" r="2.2" fill="#FAFAF9" stroke="#D59819" stroke-width="2"/>
    <path d="M10 12 L12 17 L10 22 M20 12 L18 17 L20 22" stroke="#A16207" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="40" y="22" font-size="18" font-weight="700" fill="#1C1917">麦芒网</text>
    <text x="94" y="22" font-size="11" fill="#A16207" font-weight="600">AWN</text>
  </g>
  <!-- 导航项 -->
  <g font-size="14" fill="#57534E">
    <text x="250" y="40">首页</text>
    <text x="322" y="40">演唱会</text>
    <text x="394" y="40">音乐节</text>
    <text x="466" y="40" font-weight="600" fill="#1C1917">F1 · 赛事</text>
    <rect x="458" y="52" width="56" height="3" rx="1.5" fill="#D59819"/>
    <text x="552" y="40">票务情报</text>
  </g>
  <!-- 搜索框 -->
  <g transform="translate(880,15)">
    <rect width="300" height="34" rx="17" fill="#F5F5F4"/>
    <circle cx="20" cy="17" r="7" fill="none" stroke="#78716C" stroke-width="2"/>
    <line x1="25" y1="22" x2="31" y2="28" stroke="#78716C" stroke-width="2" stroke-linecap="round"/>
    <text x="42" y="22" font-size="13" fill="#A8A29E">搜索活动、场馆、城市</text>
  </g>
  <!-- 登录按钮 -->
  <g transform="translate(1210,14)" filter="url(#cardShadow)">
    <rect width="96" height="36" rx="18" fill="url(#goldBtn)"/>
    <text x="48" y="24" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">登录 / 注册</text>
  </g>

  <!-- ===== Hero：F1 专场 ===== -->
  <g>
    <rect y="64" width="1440" height="400" fill="url(#heroBg)"/>
    <rect y="64" width="1440" height="400" fill="url(#goldGlow)"/>
    <rect y="64" width="1440" height="400" fill="url(#goldGlow2)"/>
    <!-- 赛道速度线 -->
    <g stroke="#D59819" stroke-opacity="0.16" stroke-linecap="round">
      <line x1="880" y1="150" x2="1360" y2="150" stroke-width="2"/>
      <line x1="940" y1="205" x2="1420" y2="205" stroke-width="3"/>
      <line x1="900" y1="260" x2="1300" y2="260" stroke-width="2"/>
      <line x1="980" y1="315" x2="1400" y2="315" stroke-width="4"/>
      <line x1="920" y1="370" x2="1330" y2="370" stroke-width="2"/>
    </g>
    <!-- 漂浮票券卡片 -->
    <g transform="translate(1020,150) rotate(-6)" filter="url(#floatShadow)">
      <rect width="330" height="190" rx="18" fill="#FFFFFF"/>
      <rect width="330" height="190" rx="18" fill="none" stroke="#F7ECD4" stroke-width="2"/>
      <path d="M0 60 a30 30 0 0 0 0 70" fill="#0C0A09"/>
      <path d="M330 60 a30 30 0 0 1 0 70" fill="#0C0A09"/>
      <line x1="232" y1="14" x2="232" y2="176" stroke="#E7E5E4" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="26" y="42" font-size="13" fill="#A16207" font-weight="700">AWN F1 中国大奖赛</text>
      <text x="26" y="80" font-size="24" font-weight="700" fill="#1C1917">主看台套票</text>
      <text x="26" y="112" font-size="13" fill="#57534E">上海国际赛车场 · 3 日联票</text>
      <text x="26" y="156" font-size="26" font-weight="700" fill="#A16207">¥3,680<tspan font-size="13" fill="#78716C" font-weight="400"> 起</tspan></text>
      <g transform="translate(248,120)">
        <rect width="64" height="26" rx="13" fill="#F7ECD4"/>
        <text x="32" y="18" font-size="12" font-weight="600" fill="#A16207" text-anchor="middle">可售</text>
      </g>
    </g>
    <!-- Hero 文案 -->
    <g>
      <g transform="translate(80,148)">
        <rect width="150" height="30" rx="15" fill="#D59819" fill-opacity="0.14"/>
        <rect x="0.75" y="0.75" width="148.5" height="28.5" rx="14.25" fill="none" stroke="#D59819" stroke-opacity="0.5"/>
        <text x="75" y="20" font-size="13" font-weight="600" fill="#E5B95C" text-anchor="middle">F1 中国大奖赛 · 官方专场</text>
      </g>
      <text x="80" y="238" font-size="46" font-weight="700" fill="#FFFFFF">AWN F1 赛事专场</text>
      <text x="80" y="282" font-size="16" fill="#D6D3D1">赛事日程 · 票档对比 · 公开票务动态，一站式掌握开票节奏</text>
      <g transform="translate(80,320)" filter="url(#floatShadow)">
        <rect width="148" height="48" rx="24" fill="url(#goldBtn)"/>
        <text x="74" y="30" font-size="16" font-weight="700" fill="#1C1917" text-anchor="middle">立即购票</text>
      </g>
      <g transform="translate(244,320)">
        <rect width="168" height="48" rx="24" fill="none" stroke="#57534E" stroke-width="1.5"/>
        <text x="84" y="30" font-size="16" fill="#E7E5E4" text-anchor="middle">查看票务动态</text>
      </g>
      <!-- 倒计时 -->
      <g transform="translate(80,398)">
        <text font-size="13" fill="#A8A29E">距开赛</text>
        <g transform="translate(56,0)">
          <rect width="40" height="26" rx="6" fill="#292524"/><text x="20" y="18" font-size="14" font-weight="700" fill="#E5B95C" text-anchor="middle">12</text>
        </g>
        <text x="104" y="19" font-size="13" fill="#A8A29E">天</text>
        <g transform="translate(120,0)"><rect width="40" height="26" rx="6" fill="#292524"/><text x="20" y="18" font-size="14" font-weight="700" fill="#E5B95C" text-anchor="middle">08</text></g>
        <text x="168" y="19" font-size="13" fill="#A8A29E">时</text>
        <g transform="translate(184,0)"><rect width="40" height="26" rx="6" fill="#292524"/><text x="20" y="18" font-size="14" font-weight="700" fill="#E5B95C" text-anchor="middle">45</text></g>
        <text x="232" y="19" font-size="13" fill="#A8A29E">分</text>
      </g>
    </g>
  </g>

  <!-- ===== 热门活动 ===== -->
  <g transform="translate(80,512)">
    <text x="0" y="20" font-size="24" font-weight="700" fill="#1C1917">热门活动</text>
    <g font-size="14" transform="translate(160,-2)">
      <rect x="-14" y="-8" width="72" height="32" rx="16" fill="#F7ECD4"/>
      <text x="22" y="14" font-size="14" font-weight="600" fill="#A16207" text-anchor="middle">全部</text>
      <text x="96" y="14" fill="#57534E" text-anchor="middle">演唱会</text>
      <text x="168" y="14" fill="#57534E" text-anchor="middle">音乐节</text>
      <text x="240" y="14" fill="#57534E" text-anchor="middle">体育赛事</text>
      <text x="312" y="14" fill="#57534E" text-anchor="middle">话剧</text>
    </g>
    <text x="1280" y="16" font-size="14" fill="#A16207" text-anchor="end" font-weight="500">查看全部 →</text>
  </g>

  <!-- 活动卡片 x3 -->
  <!-- 卡片 1 -->
  <g transform="translate(80,560)" filter="url(#cardShadow)">
    <rect width="413" height="360" rx="16" fill="#FFFFFF"/>
    <rect x="16" y="16" width="381" height="190" rx="10" fill="url(#coverA)"/>
    <circle cx="130" cy="105" r="38" fill="#FED7AA" opacity="0.85"/>
    <circle cx="130" cy="105" r="24" fill="#FB923C"/>
    <g transform="translate(240,90) rotate(8)"><rect width="120" height="42" rx="8" fill="#1C1917" opacity="0.72"/><text x="60" y="27" font-size="14" fill="#FDE68A" text-anchor="middle" font-weight="600">热卖中</text></g>
    <text x="330" y="52" font-size="12" fill="#FDBA74">2026.11.21 周六</text>
    <text x="26" y="242" font-size="19" font-weight="700" fill="#1C1917">「灼热之声」摇滚音乐节</text>
    <text x="26" y="272" font-size="14" fill="#57534E">上海 · 世博公园 · 11.21 - 11.22</text>
    <g transform="translate(26,292)">
      <rect width="58" height="24" rx="12" fill="#DCFCE7"/><text x="29" y="17" font-size="12" fill="#16A34A" text-anchor="middle" font-weight="500">售票中</text>
    </g>
    <text x="387" y="322" font-size="22" font-weight="700" fill="#A16207" text-anchor="end">¥480<tspan font-size="12" fill="#78716C" font-weight="400"> 起</tspan></text>
    <text x="26" y="336" font-size="12" fill="#A8A29E">已售 72% · 3 个渠道公开在售</text>
  </g>
  <!-- 卡片 2 -->
  <g transform="translate(513,560)" filter="url(#cardShadow)">
    <rect width="413" height="360" rx="16" fill="#FFFFFF"/>
    <rect x="16" y="16" width="381" height="190" rx="10" fill="url(#coverB)"/>
    <g stroke="#C4B5FD" stroke-width="2" fill="none">
      <circle cx="196" cy="100" r="44" opacity="0.6"/>
      <circle cx="196" cy="100" r="28" opacity="0.8"/>
    </g>
    <circle cx="196" cy="100" r="10" fill="#E9D5FF"/>
    <g transform="translate(240,90) rotate(8)"><rect width="120" height="42" rx="8" fill="#1C1917" opacity="0.72"/><text x="60" y="27" font-size="14" fill="#C4B5FD" text-anchor="middle" font-weight="600">预售</text></g>
    <text x="330" y="52" font-size="12" fill="#C4B5FD">2026.12.05 周六</text>
    <text x="26" y="242" font-size="19" font-weight="700" fill="#1C1917">「星夜交响」新年音乐会</text>
    <text x="26" y="272" font-size="14" fill="#57534E">北京 · 国家大剧院 · 12.05</text>
    <g transform="translate(26,292)">
      <rect width="58" height="24" rx="12" fill="#FEF3C7"/><text x="29" y="17" font-size="12" fill="#D97706" text-anchor="middle" font-weight="500">预售中</text>
    </g>
    <text x="387" y="322" font-size="22" font-weight="700" fill="#A16207" text-anchor="end">¥280<tspan font-size="12" fill="#78716C" font-weight="400"> 起</tspan></text>
    <text x="26" y="336" font-size="12" fill="#A8A29E">开票提醒已设 1.2 万人</text>
  </g>
  <!-- 卡片 3 -->
  <g transform="translate(946,560)" filter="url(#cardShadow)">
    <rect width="413" height="360" rx="16" fill="#FFFFFF"/>
    <rect x="16" y="16" width="381" height="190" rx="10" fill="url(#coverC)"/>
    <g stroke="#5EEAD4" stroke-width="2.5" fill="none" opacity="0.85">
      <path d="M60 150 C120 90 160 160 220 100 S 320 130 340 80"/>
      <path d="M60 170 C130 120 180 180 240 125 S 330 150 348 105" opacity="0.5"/>
    </g>
    <g transform="translate(240,90) rotate(8)"><rect width="120" height="42" rx="8" fill="#1C1917" opacity="0.72"/><text x="60" y="27" font-size="14" fill="#5EEAD4" text-anchor="middle" font-weight="600">余票紧张</text></g>
    <text x="330" y="52" font-size="12" fill="#5EEAD4">2026.10.25 周日</text>
    <text x="26" y="242" font-size="19" font-weight="700" fill="#1C1917">F1 中国大奖赛 · 正赛日</text>
    <text x="26" y="272" font-size="14" fill="#57534E">上海 · 上海国际赛车场 · 10.23 - 10.25</text>
    <g transform="translate(26,292)">
      <rect width="82" height="24" rx="12" fill="#FEE2E2"/><text x="41" y="17" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="500">余票紧张</text>
    </g>
    <text x="387" y="322" font-size="22" font-weight="700" fill="#A16207" text-anchor="end">¥680<tspan font-size="12" fill="#78716C" font-weight="400"> 起</tspan></text>
    <text x="26" y="336" font-size="12" fill="#A8A29E">情报：3 日票均价近 7 天 ↓ 2.1%</text>
  </g>

  <!-- ===== 页脚 ===== -->
  <g transform="translate(0,960)">
    <rect y="0" width="1440" height="40" fill="#FFFFFF"/>
    <rect y="0" width="1440" height="1" fill="#E7E5E4"/>
    <text x="720" y="26" font-size="12" fill="#A8A29E" text-anchor="middle">麦芒网 AWN · 票务交易与情报平台 · 演出报备信息已公示 · 实名购票 · 有条件退票</text>
  </g>
</svg>
